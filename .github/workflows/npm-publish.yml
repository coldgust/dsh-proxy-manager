name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Dist-tag to publish under
        type: choice
        default: next
        options: [next, latest]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish exactly the tagged commit, not whatever the branch moved to.
          ref: ${{ github.event.release.tag_name || github.ref }}

      # pnpm version is taken from package.json "packageManager"; passing
      # `version` here too would trip ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      # No `registry-url`: it would write an .npmrc with an unresolved
      # ${NODE_AUTH_TOKEN} placeholder, which breaks trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the committed artifacts
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Check the package is publishable
        run: |
          private="$(node -p "require('./package.json').private === true ? 'yes' : 'no'")"
          if [ "$private" = "yes" ]; then
            echo "::error::package.json is \"private\": true — set it to false before publishing"
            exit 1
          fi

      - name: Check package.json version matches the release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          if [ -n "$tag" ]; then
            tag="${tag#v}"
            if [ "$version" != "$tag" ]; then
              echo "::error::package.json says $version but the release tag is $tag — bump the version (or fix the tag) and release again"
              exit 1
            fi
          fi
          echo "publishing version $version"

      - name: Resolve dist-tag
        id: dist
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              tag=next
            else
              tag=latest
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "will publish with --tag $tag"

      # Fail fast with a readable message when the OIDC permission is missing,
      # instead of letting npm answer a bare `404 Not Found` for an anonymous
      # publish (that is what an unauthenticated PUT looks like).
      - name: Check trusted publishing prerequisites
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::no OIDC token endpoint — the workflow needs 'permissions: id-token: write'"
            exit 1
          fi
          if [ -f .npmrc ] && grep -q '_authToken' .npmrc; then
            echo "::error::.npmrc contains an _authToken placeholder; remove it so OIDC is used"
            exit 1
          fi
          echo "OIDC trusted publishing is available"

      # --no-git-checks: the release checkout is a detached tag, and the tarball
      # already passed install/build/test/version gates above.
      # --provenance: publish a signed build attestation alongside the tarball.
      - name: Publish to npm
        run: pnpm publish --tag "${{ steps.dist.outputs.tag }}" --no-git-checks --provenance
